<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>TRIUMPH Refresh v171</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#f4ede1;color:#231f1b;display:grid;place-items:center;min-height:100vh;margin:0}main{padding:28px;border:1px solid #d7c9b4;border-radius:24px;background:#fffaf3;max-width:640px;margin:24px}</style></head><body><main><h1>TRIUMPH Pilot Trainer v171</h1><p>正在清除舊快取並載入最新版…</p></main><script>(async()=>{try{if("serviceWorker"in navigator){const r=await navigator.serviceWorker.getRegistrations();await Promise.all(r.map(x=>x.unregister()));}}catch(e){}try{if("caches"in window){const k=await caches.keys();await Promise.all(k.map(x=>caches.delete(x)));}}catch(e){}const u=new URL("./",location.href);u.searchParams.set("v","171");u.searchParams.set("force",Date.now().toString());setTimeout(()=>location.replace(u.href),350);})();</script></body></html>
