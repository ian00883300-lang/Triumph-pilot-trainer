<!doctype html><html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>TRIUMPH v177 Refresh</title>
<style>body{font-family:system-ui,-apple-system,sans-serif;background:#f4ede1;color:#231f1b;display:grid;place-items:center;min-height:100vh;margin:0}main{padding:28px;border:1px solid #d7c9b4;border-radius:24px;background:#fffaf3;max-width:640px;margin:24px}</style>
</head><body><main><h1>TRIUMPH Pilot Trainer v177</h1>
<p>正在清除舊版快取。完成後會重新開啟最新版。</p></main>
<script>
(async()=>{
  try{
    if("serviceWorker" in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
  }catch(_){}
  try{
    if("caches" in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
  }catch(_){}
  const u=new URL("./",location.href);
  u.searchParams.set("refresh",Date.now().toString());
  setTimeout(()=>location.replace(u.href),500);
})();
</script></body></html>
