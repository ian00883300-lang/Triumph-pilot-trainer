<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>TRIUMPH v173 Refresh</title><style>body{font-family:system-ui,-apple-system,sans-serif;background:#f4ede1;color:#231f1b;display:grid;place-items:center;min-height:100vh;margin:0}main{padding:28px;border:1px solid #d7c9b4;border-radius:24px;background:#fffaf3;max-width:640px;margin:24px}</style></head><body><main><h1>TRIUMPH Pilot Trainer v173</h1><p>手動清除舊 Service Worker / Cache 後進入 v173。正式 Trainer 本身不會自動跳轉。</p></main><script>(async()=>{try{if("serviceWorker"in navigator){const r=await navigator.serviceWorker.getRegistrations();await Promise.all(r.map(x=>x.unregister()));}}catch(_){}try{if("caches"in window){const k=await caches.keys();await Promise.all(k.map(x=>caches.delete(x)));}}catch(_){}const u=new URL("./",location.href);u.searchParams.set("v","173");u.searchParams.set("refresh",Date.now().toString());setTimeout(()=>location.replace(u.href),450);})();</script></body></html>
